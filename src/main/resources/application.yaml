spring:
  application:
    name: desafio-btgpactual-backend
  mvc:
    problemdetails:
      enabled: true

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ── JPA ────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # ── Flyway ────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── RabbitMQ ──────────────────────────────────────────────────────────────────
  rabbitmq:
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
          max-retries: 3
        acknowledge-mode: auto

# ── Actuator ────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never